<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="alive-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50"/>
      <stop offset="100%" style="stop-color:#1a252f"/>
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Book cover background -->
  <rect width="200" height="280" rx="4" fill="url(#alive-bg)" filter="url(#shadow3)"/>
  
  <!-- Decorative border -->
  <rect x="10" y="10" width="180" height="260" rx="2" fill="none" stroke="#c0392b" stroke-width="2"/>
  
  <!-- Chinese character art -->
  <text x="100" y="120" font-family="STKaiti, KaiTi, serif" font-size="72" font-weight="bold" fill="#c0392b" text-anchor="middle">;</text>
  <text x="100" y="175" font-family="STKaiti, KaiTi, serif" font-size="72" font-weight="bold" fill="#e74c3c" text-anchor="middle">@</text>
  
  <!-- Author -->
  <text x="100" y="215" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="rgba(255,255,255,0.9)" text-anchor="middle">Y N</text>
  
  <!-- Category tag -->
  <rect x="65" y="235" width="70" height="22" rx="11" fill="#c0392b"/>
  <text x="100" y="250" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#fff" text-anchor="middle">‡f</text>
</svg>
