<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="space-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Book cover background -->
  <rect width="200" height="280" rx="4" fill="url(#space-bg)" filter="url(#shadow4)"/>
  
  <!-- Stars -->
  <circle cx="30" cy="40" r="1" fill="#fff"/>
  <circle cx="170" cy="30" r="1.5" fill="#fff"/>
  <circle cx="150" cy="70" r="1" fill="#fff"/>
  <circle cx="50" cy="90" r="1" fill="#fff"/>
  <circle cx="180" cy="120" r="1" fill="#fff"/>
  <circle cx="20" cy="150" r="1.5" fill="#fff"/>
  <circle cx="160" cy="200" r="1" fill="#fff"/>
  <circle cx="40" cy="220" r="1" fill="#fff"/>
  
  <!-- Three suns/bodies -->
  <circle cx="100" cy="80" r="25" fill="#ff6b35" filter="url(#glow)"/>
  <circle cx="60" cy="110" r="15" fill="#f7931e" filter="url(#glow)" opacity="0.9"/>
  <circle cx="140" cy="105" r="18" fill="#ffd700" filter="url(#glow)" opacity="0.8"/>
  
  <!-- Title -->
  <text x="100" y="165" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="36" font-weight="bold" fill="#fff" text-anchor="middle">	S</text>
  
  <!-- Subtitle -->
  <text x="100" y="190" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" text-anchor="middle">THE THREE-BODY PROBLEM</text>
  
  <!-- Author -->
  <text x="100" y="220" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">H#</text>
  
  <!-- Category tag -->
  <rect x="65" y="240" width="70" height="22" rx="11" fill="rgba(255,107,53,0.8)"/>
  <text x="100" y="255" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#fff" text-anchor="middle">Ñ{</text>
</svg>
