<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="eco-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72"/>
      <stop offset="100%" style="stop-color:#2a5298"/>
    </linearGradient>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Book cover background -->
  <rect width="200" height="280" rx="4" fill="url(#eco-bg)" filter="url(#shadow5)"/>
  
  <!-- Decorative border -->
  <rect x="10" y="10" width="180" height="260" rx="2" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  
  <!-- Chart graphic -->
  <g transform="translate(40, 50)">
    <!-- Grid lines -->
    <line x1="0" y1="80" x2="120" y2="80" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="0" y1="60" x2="120" y2="60" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="0" y1="40" x2="120" y2="40" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <line x1="0" y1="20" x2="120" y2="20" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    
    <!-- Bars -->
    <rect x="10" y="50" width="15" height="30" fill="#27ae60" rx="2"/>
    <rect x="35" y="35" width="15" height="45" fill="#2ecc71" rx="2"/>
    <rect x="60" y="20" width="15" height="60" fill="#27ae60" rx="2"/>
    <rect x="85" y="10" width="15" height="70" fill="#2ecc71" rx="2"/>
    
    <!-- Trend line -->
    <polyline points="17,45 42,30 67,15 92,5" fill="none" stroke="#f39c12" stroke-width="2"/>
    <circle cx="17" cy="45" r="3" fill="#f39c12"/>
    <circle cx="42" cy="30" r="3" fill="#f39c12"/>
    <circle cx="67" cy="15" r="3" fill="#f39c12"/>
    <circle cx="92" cy="5" r="3" fill="#f39c12"/>
  </g>
  
  <!-- Title -->
  <text x="100" y="165" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="bold" fill="#fff" text-anchor="middle">ÏNfŸ</text>
  
  <!-- Subtitle -->
  <text x="100" y="185" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.7)" text-anchor="middle">PRINCIPLES OF ECONOMICS</text>
  
  <!-- Author -->
  <text x="100" y="215" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)" text-anchor="middle">N. Gregory Mankiw</text>
  <text x="100" y="230" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">ü</text>
  
  <!-- Category tag -->
  <rect x="65" y="245" width="70" height="22" rx="11" fill="#27ae60"/>
  <text x="100" y="260" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#fff" text-anchor="middle">ÏN</text>
</svg>
