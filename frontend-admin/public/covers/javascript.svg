<svg xmlns="http://www.w3.org/2000/svg" width="200" height="280" viewBox="0 0 200 280">
  <defs>
    <linearGradient id="js-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7DF1E"/>
      <stop offset="100%" style="stop-color:#E8C50E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Book cover background -->
  <rect width="200" height="280" rx="4" fill="url(#js-bg)" filter="url(#shadow)"/>
  
  <!-- Decorative pattern -->
  <rect x="10" y="10" width="180" height="260" rx="2" fill="none" stroke="#333" stroke-width="2" opacity="0.3"/>
  
  <!-- JS Logo -->
  <rect x="60" y="50" width="80" height="80" rx="8" fill="#323330"/>
  <text x="75" y="115" font-family="Arial Black, sans-serif" font-size="48" font-weight="bold" fill="#F7DF1E">JS</text>
  
  <!-- Title -->
  <text x="100" y="165" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#323330" text-anchor="middle">JavaScript</text>
  <text x="100" y="183" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="bold" fill="#323330" text-anchor="middle">ÿßèæ°</text>
  
  <!-- Author -->
  <text x="100" y="215" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#555" text-anchor="middle">Nicholas C. Zakas</text>
  
  <!-- Category tag -->
  <rect x="65" y="235" width="70" height="22" rx="11" fill="#323330"/>
  <text x="100" y="250" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#F7DF1E" text-anchor="middle">°ó:</text>
</svg>
